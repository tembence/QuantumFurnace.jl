name: Documentation

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULIA_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Build documentation (deploy on pushes)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QF_DOCS_DEPLOY: ${{ github.event_name == 'push' }}
        run: julia --project=docs --startup-file=no --heap-size-hint=1500M docs/make.jl
